<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#052b1b">
  <title>Alfa | Digital Business Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="./logoooo.png">
</head>
<body>

<main class="card">

  <!-- ===== Header ===== -->
  <header class="hero">
    <div class="hero__top">
      <a class="brand" id="brandLink" href="#" aria-label="Alfa TCL for Lighting">
        <img class="brand__logo" id="logo" src="logo.png" alt="Alfa TCL for Lighting">
      </a>

      <button class="share" id="shareBtn" type="button" aria-label="Share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15V3M8 7l4-4 4 4"/>
          <path d="M5 11v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/>
        </svg>
      </button>
    </div>

    <button class="avatar" id="avatarBtn" type="button" aria-label="View photo">
      <img id="photo" src="./profile.png" alt="Profile photo"
           onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23134d34%22/><circle cx=%2250%22 cy=%2238%22 r=%2218%22 fill=%22%2389c9a6%22/><path d=%22M15 95c0-22 15-34 35-34s35 12 35 34z%22 fill=%22%2389c9a6%22/></svg>'">
    </button>

    <h1 class="name" id="name">Name</h1>
    <p class="title" id="title">Title</p>
  </header>

  <!-- ===== Action buttons ===== -->
  <section class="actions">

    <a class="btn" id="callBtn" href="#">
      <span class="btn__icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
      </span>
      <span class="btn__label"><strong>Call me</strong><small id="callText"></small></span>
      <span class="btn__arrow"><i></i></span>
    </a>

    <a class="btn" id="waBtn" href="#" target="_blank" rel="noopener">
      <span class="btn__icon btn__icon--wa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
          <path d="M12 2.5a9.5 9.5 0 0 0-8.1 14.4L2.5 21.5l4.7-1.3A9.5 9.5 0 1 0 12 2.5z"/>
          <g transform="translate(6.3 6.2) scale(0.5)" fill="currentColor" stroke="none"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></g>
        </svg>
      </span>
      <span class="btn__label"><strong>WhatsApp</strong><small id="waText"></small></span>
      <span class="btn__arrow"><i></i></span>
    </a>

    <button class="btn" id="wechatBtn" type="button">
      <span class="btn__icon">
        <svg viewBox="0 0 24 24"><ellipse cx="9.3" cy="9.2" rx="8.2" ry="7" fill="currentColor"/><path d="M4.4 14 3 18.4l4.4-2.2z" fill="currentColor"/><circle cx="6.6" cy="7.6" r="1.1" style="fill:var(--g-light)"/><circle cx="12" cy="7.6" r="1.1" style="fill:var(--g-light)"/><ellipse cx="15.7" cy="15.2" rx="6.5" ry="5.4" fill="currentColor" style="stroke:var(--g-light)" stroke-width="1.3"/><path d="M19.6 19.2l1.4 2.9-3.4-1.6z" fill="currentColor" style="stroke:var(--g-light)" stroke-width="1" stroke-linejoin="round"/><circle cx="13.6" cy="14" r=".95" style="fill:var(--g-light)"/><circle cx="17.7" cy="14" r=".95" style="fill:var(--g-light)"/></svg>
      </span>
      <span class="btn__label"><strong>WeChat</strong><small id="wechatText"></small></span>
      <span class="btn__arrow"><i></i></span>
    </button>

    <a class="btn" id="liBtn" href="#" target="_blank" rel="noopener">
      <span class="btn__icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="5" r="2.3"/><rect x="2.9" y="9" width="4.2" height="12"/>
          <path d="M10 9h4v1.8C14.8 9.5 16 8.8 17.7 8.8 20.6 8.8 22 10.7 22 14v7h-4v-6.2c0-1.3-.5-2.2-1.7-2.2S14 13.5 14 14.8V21h-4z"/>
        </svg>
      </span>
      <span class="btn__label"><strong>Linkedin</strong><small id="liText"></small></span>
      <span class="btn__arrow"><i></i></span>
    </a>

    <a class="btn" id="mailBtn" href="#">
      <span class="btn__icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </span>
      <span class="btn__label"><strong>Email</strong><small id="mailText"></small></span>
      <span class="btn__arrow"><i></i></span>
    </a>

  </section>

  <!-- ===== Social ===== -->
  <footer class="social">
    <div class="social__icons">
      <a id="fbLink" href="#" target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24"><rect x="1.5" y="1.5" width="21" height="21" rx="4.5" fill="currentColor"/><path fill="#fff" d="M15.5 22v-8h2.7l.4-3.2h-3.1V8.9c0-.9.3-1.5 1.6-1.5h1.6V4.5c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.4-4 4.1v2.3H9.6V14h2.7v8z"/></svg>
      </a>
      <a id="igLink" href="#" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="2" y="2" width="20" height="20" rx="6"/><circle cx="12" cy="12" r="4.6"/><circle cx="17.6" cy="6.4" r="1.2" fill="currentColor" stroke="none"/></svg>
      </a>
      <a id="waLink" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5a9.5 9.5 0 0 0-8.1 14.4L2.5 21.5l4.7-1.3A9.5 9.5 0 1 0 12 2.5z"/><g transform="translate(6.3 6.2) scale(0.5)" fill="currentColor" stroke="none"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></g></svg>
      </a>
      <a id="liLink" href="#" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24"><rect x="1.5" y="1.5" width="21" height="21" rx="4.5" fill="currentColor"/><circle cx="7.3" cy="7.6" r="1.6" fill="#fff"/><rect x="5.9" y="10.2" width="2.8" height="7.6" fill="#fff"/><path fill="#fff" d="M10.6 10.2h2.7v1.1c.5-.8 1.4-1.3 2.5-1.3 2.1 0 3.1 1.3 3.1 3.6v4.2h-2.8v-3.8c0-.9-.3-1.5-1.1-1.5s-1.3.6-1.3 1.5v3.8h-2.7z"/></svg>
      </a>
      <a id="webLink" href="#" target="_blank" rel="noopener" aria-label="Website">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19"/><path d="M12 2.5c2.6 2.6 4 6 4 9.5s-1.4 6.900-4 9.500c-2.6-2.600-4-6-4-9.500s1.400-6.900 4-9.500z"/></svg>
      </a>
    </div>
    <p class="social__label">FOLLOW US ON</p>
  </footer>

</main>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet__handle"></div>
    <h2 class="sheet__title" id="sheetTitle"></h2>
    <div class="sheet__list" id="sheetList"></div>
    <button class="sheet__cancel" id="sheetCancel" type="button">Cancel</button>
  </div>
</div>

<div class="sheet" id="wechatSheet" aria-hidden="true">
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="wechatTitle">
    <div class="sheet__handle"></div>
    <h2 class="sheet__title" id="wechatTitle">WeChat</h2>
    <img class="wechat__qr" id="wechatQr" alt="WeChat QR code" hidden>
    <div class="wechat__idbox">
      <div class="wechat__label">WECHAT ID</div>
      <div class="wechat__id" id="wechatId"></div>
    </div>
    <button class="sheet__copy" id="wechatCopy" type="button">Copy ID</button>
    <button class="sheet__cancel" id="wechatClose" type="button">Cancel</button>
  </div>
</div>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox__close" id="lightboxClose" type="button" aria-label="Close">&times;</button>
  <img id="lightboxImg" alt="Profile photo">
</div>

<div class="toast" id="toast" role="status" aria-live="polite">Link copied</div>

<script src="script.js"></script>
</body>
</html>
